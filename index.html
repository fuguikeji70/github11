<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="description" content="娱乐城">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#CCE6DD">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/home.css">
<link rel="stylesheet" href="assets/css/blocks.css">
</head>
<body>

<div class="app">
  <main class="home">

    <!-- 顶部：logo + 注册/登录 -->
    <header class="home__header">
      <a href="index.html" aria-label="首页">
        <img class="home__logo" src="assets/img/logo.png" alt="">
      </a>
      <div class="home__actions">
        <a class="pill pill--ghost" href="https://t3.62au.net/">注册</a>
        <a class="pill pill--primary" href="https://t3.62au.net/">登录</a>
      </div>
    </header>

    <!-- 优惠活动：一次一张，3 秒自动切下一张（替换原 Banner） -->
    <section class="offers" aria-label="优惠活动">
      <div class="offers__track">
        <a class="offer" href="https://t3.62au.net/">
          <div class="offer__copy">
            <h3 class="offer__title">新人豪礼</h3>
            <p class="offer__detail">新人首充 <b>10</b><small>%</small></p>
            <span class="offer__btn">立即领取 <i>❯</i></span>
          </div>
          <img class="offer__art" src="assets/img/wz/reward-welcome.webp" alt="" width="640" height="427" decoding="async">
        </a>

        <a class="offer" href="https://t3.62au.net/">
          <div class="offer__copy">
            <h3 class="offer__title">代理重磅</h3>
            <p class="offer__detail"> <b>佣金10%-50%<br>扶持负盈利</b><small>%</small></p>
            <span class="offer__btn">立即领取 <i>❯</i></span>
          </div>
          <img class="offer__art" src="assets/img/wz/reward-cashback.webp" alt="" width="640" height="427" decoding="async">
        </a>

        <a class="offer" href="https://t3.62au.net/">
          <div class="offer__copy">
            <h3 class="offer__title">充值优惠</h3>
            <p class="offer__detail">最高赠送 <b>8888</b><small>元</small></p>
            <span class="offer__btn">立即领取 <i>❯</i></span>
          </div>
          <img class="offer__art" src="assets/img/wz/reward-recharge.webp" alt="" width="640" height="427" decoding="async">
        </a>

        <a class="offer" href="https://t3.62au.net/">
          <div class="offer__copy">
            <h3 class="offer__title">多重活动</h3>
            <p class="offer__detail">精彩不断 惊喜不停</p>
            <span class="offer__btn">查看详情 <i>❯</i></span>
          </div>
          <img class="offer__art" src="assets/img/wz/reward-events.webp" alt="" width="640" height="427" decoding="async">
        </a>
      </div>

      <div class="offers__dots" role="tablist" aria-label="优惠活动切换">
        <i class="offers__dot is-active" role="tab" aria-selected="true"></i>
        <i class="offers__dot" role="tab" aria-selected="false"></i>
        <i class="offers__dot" role="tab" aria-selected="false"></i>
        <i class="offers__dot" role="tab" aria-selected="false"></i>
      </div>
    </section>

    <!-- 入场横幅：显示在滚动广告（现为优惠活动）下方 -->
    <a class="entry-banner" href="https://app.62au.net/" aria-label="点击进入">
      <img src="assets/img/wz/entry-banner.webp" alt="点击进入 房间号 888887" width="896" height="322" decoding="async">
    </a>

    <!-- 8 个分类：自动横向循环缓慢滚动，不手动翻页 -->
    <section class="marquee cats" aria-label="游戏分类">
      <div class="marquee__track" data-speed="26">
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-lottery.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果六合彩</span>
          <span class="cat__play">立即游戏</span>
        </a>
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-fast.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果赛车前</span>
          <span class="cat__play">立即游戏</span>
        </a>
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-racing.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果赛车后</span>
          <span class="cat__play">立即游戏</span>
        </a>
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-cards.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果时时彩一</span>
          <span class="cat__play">立即游戏</span>
        </a>
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-slots.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果时时彩二</span>
          <span class="cat__play">立即游戏</span>
        </a>
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-fishing.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果时时彩三</span>
          <span class="cat__play">立即游戏</span>
        </a>
        <a class="cat" href="https://t3.62au.net/">
          <img class="cat__icon" src="assets/img/wz/cat-canada.webp" alt="" width="192" height="192" decoding="async">
          <span class="cat__name">宾果时时彩四</span>
          <span class="cat__play">立即游戏</span>
        </a>

      </div>
    </section>

    <!-- 中段横幅 -->
    <a class="mid-banner" href="https://app.62au.net/" aria-label="活动详情">
      <img src="assets/img/wz/banner-mid.webp" alt="多重好礼 天天有" width="1200" height="150" decoding="async">
    </a>
  <a class="mid-banner" href="https://www.163go.vip/" aria-label="活动详情">
      <img src="assets/img/wz/banner-mid2.webp" alt="多重好礼 天天有" width="1200" height="150" decoding="async">
    </a>
      <a class="mid-banner" href="bingo.html" aria-label="活动详情">
      <img src="assets/img/wz/banner-mid1.webp" alt="多重好礼 天天有" width="1200" height="150" decoding="async">
    </a>
  </main>

  <!-- 底部 Tabbar -->
  <nav class="tabbar" aria-label="底部导航">
    <a class="tabbar__item is-active" href="index.html" aria-current="page">
      <img class="tabbar__icon" src="assets/img/tab-home.png" alt="">
      <span class="tabbar__label">首页</span>
    </a>
    <a class="tabbar__item" href="https://t3.62au.net">
      <img class="tabbar__icon" src="assets/img/tab-wallet.png" alt="">
      <span class="tabbar__label">钱包</span>
    </a>
    <a class="tabbar__item tabbar__item--bulge" href="https://td1888.xyz/bg699/">
      <img class="tabbar__bulge" src="assets/img/tab-service.png" alt="客服">
    </a>
    <a class="tabbar__item" href="#" data-drawer-open="offers">
      <img class="tabbar__icon" src="assets/img/tab-activity.png" alt="">
      <span class="tabbar__label">活动</span>
    </a>
    <a class="tabbar__item" href="https://t3.62au.net">
      <img class="tabbar__icon" src="assets/img/tab-mine.png" alt="">
      <span class="tabbar__label">我的</span>
    </a>
  </nav>

  <!-- 活动抽屉：点底部「活动」从屏幕下方推上来，里面是优惠活动的竖排列表 -->
  <div class="drawer" id="offersDrawer" hidden>
    <div class="drawer__backdrop" data-drawer-close></div>
    <section class="drawer__sheet" role="dialog" aria-modal="true" aria-labelledby="offersDrawerTitle">
      <span class="drawer__grabber" aria-hidden="true"></span>
      <header class="drawer__head">
        <h2 class="drawer__title" id="offersDrawerTitle">优惠活动</h2>
        <button class="drawer__close" type="button" data-drawer-close aria-label="关闭">×</button>
      </header>
      <!-- 卡片由 main.js 从首页轮播处拷贝过来，改内容只改上面那一份 -->
      <div class="drawer__body">
        <div class="offers offers--stack" data-drawer-list></div>
      </div>
    </section>
  </div>
</div>

<script src="assets/js/main.js" defer></script>
</body>
</html>
